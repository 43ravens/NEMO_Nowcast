name: Assign Issue/PR

permissions: {}

on:
  issues:
    types:
      - reopened
      - opened
  pull_request:
    types:
      - reopened
      - opened
jobs:
  auto_assign:
    name: Automatically assign Issue/PR to Doug
    permissions:
      issues: write  # Required to add assignee to issue
      pull-requests: write  # Required to add assignee to pull request
    uses: UBC-MOAD/gha-workflows/.github/workflows/auto-assign.yaml@main  # zizmor: ignore[unpinned-uses]
